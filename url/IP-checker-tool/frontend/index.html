<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AccessiScan</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div id="app">
    <div class="container">
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="tr">TR</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <h1 data-i18n="title">URL Erişilebilirlik Kontrolü</h1>
      <p data-i18n="subtitle">Excel dosyanızı yükleyin ve URL'lerin durumunu anında öğrenin.</p>

      <div class="upload-area" id="drop-zone">
        <span class="upload-icon">📁</span>
        <p id="file-name" data-i18n="uploadHint">Excel dosyasını buraya sürükleyin veya seçin</p>
        <input type="file" id="file-input" accept=".xlsx, .xls" />
      </div>

      <button id="start-btn" class="btn" data-i18n="startBtn">Kontrolü Başlat</button>

      <div id="status-container" class="status-container">
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="status-text" data-i18n="checkingStatus">URL'ler kontrol ediliyor...</p>
      </div>

      <div id="results-area" class="results-area">
        <div class="result-card">
          <h3 class="success" data-i18n="accessible">Erişilebilir</h3>
          <p id="success-count">0 URL</p>
          <button id="download-success" class="btn" style="display: block; width: 100%; margin-top: 1rem;"
            data-i18n="downloadResult">Excel İndir</button>
        </div>
        <div class="result-card">
          <h3 class="failure" data-i18n="inaccessible">Erişilemez</h3>
          <p id="error-count">0 URL</p>
          <button id="download-error" class="btn" style="display: block; width: 100%; margin-top: 1rem;"
            data-i18n="downloadResult">Excel İndir</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>

</html>
